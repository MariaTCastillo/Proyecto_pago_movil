<!DOCTYPE html>
<html>
<head>
    <meta charset = "utf-8">
    <title >Smart Pago Móvil SMS</title>
    <link rel="icon" type="png" href="IMAGENES/sms.png">
    <link rel="stylesheet" href="CSS/styles2.css">
</head>
<body>
  <section>
    <img src="IMAGENES/Telefono SMS.png" alt="Smart Pago Movil SMS">  
    <div>
      <imag src="IMAGENES/usuario.png" alt="Imagen del contacto">
      <form id="pagoMovil">
        <fieldset>  
          <legend>2661</legend>
            <label>Banco</label>
            <input type="text" id="codigo" required>
            <label>Telefono</label>
            <input type="text" id="telefono" required>
            <label>Cedula/Rif</label>
            <select>
                <option>V</option>
                <option>J</option>
            </select>
            <input type="text" id="documento" required>
            <label>Monto</label>
            <input type="text" id="monto" >
            <input type="submit" value="Enviar mensaje de texto">
        </fieldset>
        <p><a href="Index.html">Salir de la mensajería</a></p>
      </form>
    </div>
  </section>
  <script src="JAVASCRIPT/transaccionsms.js"></script>
</body>
</html>
